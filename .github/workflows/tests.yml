name: Cars CRUD Tests

# 1. 触发条件：针对 main 分支的 PR，且 PR 更新（推送新 commit）时重新运行
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # 2. 下载仓库代码
      - name: Checkout repository
        uses: actions/checkout@v7

      # 3. 设置 Python 环境
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 4. 安装依赖
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # 5. 安装 Playwright Chromium 及其 Linux 系统依赖
      # 注意：Ubuntu 环境必须加 --with-deps，否则缺库会报错
      - name: Install Playwright Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium

      # 6. 依次执行四个测试组（作为独立步骤）
      - name: Run Unit Tests
        run: python -m pytest tests/unit -q

      - name: Run Integration Tests
        run: python -m pytest tests/integration -q

      - name: Run API Tests
        run: python -m pytest tests/api -q

      - name: Run E2E Tests
        run: python -m pytest tests/e2e -q