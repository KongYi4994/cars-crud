name: Cars CRUD Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Playwright Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run Unit Tests
        run: python -m pytest tests/unit -q
      - name: Run Integration Tests
        run: python -m pytest tests/integration -q
      - name: Run API Tests
        run: python -m pytest tests/api -q
      - name: Run E2E Tests
        run: python -m pytest tests/e2e -q

  publish:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            junyuanzhang233/cars-crud:latest
            junyuanzhang233/cars-crud:sha-${{ github.sha }}